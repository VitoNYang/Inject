name: Unit Tests

on:
  push:
    branches: 
    - main
    paths-ignore:
    - 'Sources/Inject.docc/**'
  pull_request:
    branches: 
    - main
    paths-ignore:
    - 'Sources/Inject.docc/**'

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.2"
    - name: Test
      run: swift test -v
